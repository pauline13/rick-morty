services:
  host:
    profiles:
      - dev

    build:
      context: .
      dockerfile: Dockerfile.dev

    working_dir: /app

    volumes:
      - .:/app
      - host_node_modules:/app/node_modules

    ports:
      - '5173:5173'

    depends_on:
      - favorites

    stdin_open: true
    tty: true

  favorites:
    profiles:
      - dev

    build:
      context: ../rick-morty-favorites-mf
      dockerfile: Dockerfile.dev

    working_dir: /app

    volumes:
      - ../rick-morty-favorites-mf:/app
      - favorites_node_modules:/app/node_modules

    ports:
      - '5001:5001'

    stdin_open: true
    tty: true

volumes:
  host_node_modules:
  favorites_node_modules:
